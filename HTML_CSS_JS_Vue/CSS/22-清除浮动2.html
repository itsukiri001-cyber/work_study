<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除浮动</title>
    <style>
        .container{
            width: 500px;
            border: 10px solid black;
        
        }
        .box1{
            width: 200px;
            height: 200px;
            background-color: greenyellow;
            float: left;
        }
        .clear{
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <p>这是一个p1标签</p>
        <!--<div class="clear"></div>--> <!--添加新的空元素-->
    </div>
    <p>这是一个p2标签</p>
</body>
</html>
