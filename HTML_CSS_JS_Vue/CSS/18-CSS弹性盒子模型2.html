<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cotainer{
            width: 500px;
            height: 500px;
            background-color: bisque;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }  
        .box1{
            width: 500px;
            height: 500px;
            background-color: aqua;
            flex: 2;
        }
        .box2{
            width: 500px;
            height: 500px;
            background-color: green;
            flex: 2;
        }
        .box3{
            width: 500px;
            height: 500px;
            background-color: blue;
            flex: 1;
            
        }
    </style>
</head>
<body>
    <div class="cotainer">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>

    </div>
</body>
</html>
