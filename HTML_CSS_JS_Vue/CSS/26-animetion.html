<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做个小动画</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            padding: 60px;
            animation: MyAnime 10s linear 2s infinite;
        }

        @keyframes MyAnime{
            0%{background-color: red;
            width: 100px;}
            50%{background-color: green;
            width: 600px;}
            100%{background-color: blue;
            width: 50px;}
        }

    </style>
</head>
<body>
    <div></div>
</body>
</html>
