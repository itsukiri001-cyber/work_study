<!DOCTYPE html><!-- 声明，防止奇异浏览器 不算基本骨架标签 -->

<html lang="en">
<head><!-- head标签里的 不是给用户看的 -->
    <meta charset="UTF-8"><!-- meta是单标签用来描述HTML网页文档属性。编码格式是"UTF-8"-->>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check your offer</title><!-- 这个是标题。title的增加有利于SEO搜索引擎优化,满足排名需求 -->
</head>
<body><!-- body标签里的 是给用户看的 -->
    Welcome to our Company!Mr.Ri
</body>
</html>
