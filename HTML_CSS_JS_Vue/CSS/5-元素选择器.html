<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            color: blue;
            font-size: 30px;
        }
        span{
            color: brown;
            font-size: 60px;
        }
    </style>

</head>
<body>
    <h1>这是一级标题</h1>
    <p>这是一个文本</p>
    <p>这是第二个文本</p>
    <h2>这是二级标题</h2>
    <p>这是最后一个文本</p>
    <p>没有<span>理想</span>，那么和<span>咸鱼</span>有什么区别</p>
</body>
</html>
