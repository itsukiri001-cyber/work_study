<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: aqua;
            width: 500px;
            height: 500px;
            position: relative;
            left: 200px;
        }

        .box1{
            background-color: red;
            width: 100px;
            height: 100px;
            position: absolute;
            top: 100px;
            left: 200px;
        }

        .box2{
            background-color:blue;
            width: 100px;
            height: 100px;
            position: fixed;
            right: 10px;
            bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
</body>
</html>
