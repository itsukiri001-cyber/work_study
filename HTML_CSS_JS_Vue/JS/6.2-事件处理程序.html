<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM0级事件处理</title>
</head>
<body>
    <button id="btn1">点击这个按钮啊</button>

    <script>//DOM0级事件处理 优点：HTML和JS文件分离 缺点：无法同时添加多个事件 不常用
        var btn1 = document.getElementById('btn1')
        btn1.onclick = function(){
            console.log('点击了')
        }
    </script>
</body>
</html>
